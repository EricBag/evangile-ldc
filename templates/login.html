<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Accès protégé — Évangile du jour</title>
    <link rel="stylesheet" href="/static/styles.css?v=5"/>

    <link rel="apple-touch-icon" sizes="180x180" href="/static/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#c9b074">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Évangile LDC">
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function () {});
        });
      }
    </script>
</head>
<body class="page-login">
    <main class="login-container">
        <img src="/static/luisa.jpg" alt="Luisa Piccarreta" class="login-photo"/>
        <h1 class="login-title">Accès protégé</h1>
        <p class="login-subtitle">Veuillez saisir le mot de passe pour accéder à l'application.</p>

        <form method="POST" action="/login" class="login-form">
            <input
                type="password"
                name="password"
                placeholder="Mot de passe"
                class="login-input"
                autofocus
                required
            />
            {% if error %}
            <p class="login-error">{{ error }}</p>
            {% endif %}
            <button type="submit" class="login-button">Entrer</button>
        </form>

        <div id="install-zone" class="install-zone"></div>
    </main>
    <script src="/static/install.js" defer></script>
</body>
</html>
